<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retail Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--canvas:#030a1c;--panel:#081329;--card:#0c1b3b;--cyan:#00b4d8;--green:#2ec4b6;--text:#fff;--muted:#9fb3d9;--line:#1f3566;--sel:#0b5394}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--canvas);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}
.app{display:flex;gap:10px;padding:8px;min-height:100vh}
.sidebar{width:230px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.brand{color:#5db3ff;font-size:22px;font-weight:700;margin:6px 2px 14px}
.tab{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;margin-bottom:8px;padding:6px 10px;background:#fff;color:#000;border:0;border-radius:6px;font:600 14px "Segoe UI",sans-serif;text-align:center;cursor:pointer}
.tab:hover{background:#e6eefc}
.tab.active{background:var(--sel);color:#fff;font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.title{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.title h1{margin:0;font-size:32px}
.slicers{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.slicer{background:#1c1f26;border-radius:4px;padding:6px 8px}
.slicer label{display:block;font-weight:700;font-size:16px;color:#cfe4ff;margin-bottom:4px}
.slicer select{width:100%;background:var(--panel);color:#fff;border:1px solid #9fb3d9;border-radius:3px;padding:3px 6px;font:14px "Segoe UI",sans-serif}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.kpi{background:#0a101d;border:1px solid var(--line);border-left:3px solid #fff;border-radius:6px;padding:14px 8px;text-align:center}
.kpi .l{color:#5db3ff;font-weight:600;font-size:16px}
.kpi .v{font-size:28px;font-weight:700;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:#2a2f3d;border:1px solid #5a6a8a;border-radius:6px;padding:8px 10px;display:flex;flex-direction:column}
.panel h3{margin:0 0 4px;font-size:14px;font-weight:700;color:#5db3ff}
.cw{position:relative;height:240px}
.page{display:none;flex-direction:column;gap:10px}
.page.active{display:flex}
.ph{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:60px 20px;text-align:center;color:var(--muted)}
@media(max-width:900px){.app{flex-direction:column}.sidebar{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.brand{grid-column:1/-1}.tab{margin:0}.slicers,.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="brand">Retail Analytics</div><div id="nav" style="display:contents"></div></aside>
  <main class="main">
    <div class="title"><h1 id="pageTitle">Customer Analytics</h1></div>
    <div class="slicers" id="slicers"></div>
    <div id="pages"></div>
  </main>
</div>

<script>
/* ---------- Pages registry: add a view + init per screenshot ---------- */
const PAGES = [
  {name:"Executive Overview", build:buildExecutiveOverview},
  {name:"Sales Trend Analysis", build:buildSalesTrend},
  {name:"Product Performances", build:buildProductPerformances},
  {name:"Customer Analytics", build:buildCustomerAnalytics},
  {name:"Region/City Sales", build:buildRegionCity},
  {name:"Monthly & Seasonal Dashboard", build:buildMonthlySeasonal},
  {name:"Customer Behaviour", build:buildCustomerBehaviour},
  {name:"Profit & Revenue", build:buildProfitRevenue},
  {name:"Inventory Risk", build:buildInventoryRisk},
  {name:"Order & Transaction", build:buildOrderTransaction}
];
const built = {};
const charts = {};

/* ---------- Shared pieces ---------- */
['Year','City','Category','Store','Channel','Brand'].forEach(s=>{
  slicers.insertAdjacentHTML('beforeend',`<div class="slicer"><label>${s}</label><select data-slicer="${s}"><option>All</option></select></div>`);
});
PAGES.forEach((p,i)=>{
  nav.insertAdjacentHTML('beforeend',`<button class="tab" data-i="${i}">${p.name}</button>`);
  pages.insertAdjacentHTML('beforeend',`<section class="page" id="page-${i}"></section>`);
});
nav.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)showDashboard(+b.dataset.i)});

function kpiRow(items){return `<div class="kpis">${items.map(k=>`<div class="kpi"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join('')}</div>`}
function panel(title,id,h){return `<div class="panel"><h3>${title}</h3><div class="cw" style="height:${h||240}px"><canvas id="${id}"></canvas></div></div>`}

Chart.defaults.color='#fff';
Chart.defaults.font.family='"Segoe UI",sans-serif';
Chart.defaults.font.size=11;
Chart.defaults.font.weight='600';

/* Value labels drawn on bars / outside donut slices */
const valueLabels={id:'valueLabels',afterDatasetsDraw(c,_,o){
  if(!o||!o.labels)return;const {ctx}=c;const meta=c.getDatasetMeta(0);
  ctx.save();ctx.fillStyle='#fff';ctx.font='600 10px "Segoe UI"';
  meta.data.forEach((el,i)=>{const t=o.labels[i];
    if(['doughnut','pie'].includes(c.config.type)){
      const a=(el.startAngle+el.endAngle)/2,r=el.outerRadius+8;
      const x=el.x+Math.cos(a)*r,y=el.y+Math.sin(a)*r,cs=Math.cos(a);
      ctx.textAlign=Math.abs(cs)<.25?'center':(cs>0?'left':'right');ctx.textBaseline='middle';
      ctx.fillText(t,x,y);
    }else if(c.options.indexAxis==='y'){
      ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(t,el.x+6,el.y);
    }else{ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(t,el.x,el.y-6)}
  });ctx.restore();}};
const legendBottom={position:'bottom',labels:{usePointStyle:true,pointStyle:'circle',boxWidth:8,color:'#fff'}};
const donutBase=(labels,data,colors,txt)=>({type:'doughnut',data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0}]},
  plugins:[valueLabels],options:{maintainAspectRatio:false,cutout:'68%',layout:{padding:28},
  plugins:{legend:legendBottom,valueLabels:{labels:txt},tooltip:{enabled:true}}}});
const mk=(id,cfg)=>{if(charts[id])charts[id].destroy();charts[id]=new Chart(document.getElementById(id),cfg)};

/* ---------- Page 4: Customer Analytics ---------- */
function buildCustomerAnalytics(root){
  root.innerHTML=
   kpiRow([['Total Revenue','10.92bn'],['Total Orders','5M'],['Total Units Sold','19M'],['Profit Margin %','27.57%'],['Total Customers','10K'],['Gross Profit','3.01bn']])+
   `<div class="grid">${panel('Customers by loyalty_segment','ca1')}${panel('Revenue by Loyal Segment','ca2')}
    ${panel('Revenue By Age','ca3')}${panel('Total Customers by channel','ca4')}</div>`;

  mk('ca1',donutBase(['Bronze','Silver','Gold','Platinum'],[39.69,31.06,19.05,10.2],
    ['#e8703a','#1e88ff','#12259a','#6a0f7a'],['4K (39.69%)','3K (31.06%)','2K (19.05%)','1K (10.2%)']));

  mk('ca2',{type:'bar',plugins:[valueLabels],data:{labels:['Silver','Gold','Bronze','Platinum'],
    datasets:[{data:[6.5,6.0,5.8,5.0],backgroundColor:['#5b6fc9','#85aae8','#3f4fb0','#a0d2ff'],barPercentage:.5}]},
    options:{maintainAspectRatio:false,layout:{padding:{top:20}},plugins:{legend:{display:false},valueLabels:{labels:['6.5M','6.0M','5.8M','5.0M']}},
    scales:{x:{grid:{display:false},border:{display:false}},y:{display:false,min:0,max:7}}}});

  mk('ca3',{type:'bar',plugins:[valueLabels],data:{labels:['36-45','26-35','46-60','18-25','60+'],
    datasets:[{data:[2916,2652,2247,1798,387],backgroundColor:'#1e88ff',barPercentage:.85,categoryPercentage:.95}]},
    options:{indexAxis:'y',maintainAspectRatio:false,layout:{padding:{right:36}},
    plugins:{legend:{display:false},valueLabels:{labels:['2916','2652','2247','1798','387']}},
    scales:{x:{display:false,min:0},y:{grid:{display:false},border:{display:false}}}}});

  mk('ca4',donutBase(['In-Store','Mobile App','Online'],[33.33,33.33,33.33],['#1e88ff','#e8703a','#12259a'],['33.33%','33.33%','33.33%']));
}

/* ---------- Page 2: Sales Trend Analysis ---------- */
function buildSalesTrend(root){
  root.innerHTML=`<style>.g2s{grid-template-columns:1fr 1.5fr;align-items:stretch}.stk2{display:flex;flex-direction:column;gap:10px}.tall .cw{flex:1}@media(max-width:900px){.g2s{grid-template-columns:1fr}}</style>`+
   kpiRow([['Total Revenue','10.92bn'],['Total Orders','5M'],['Total Units Sold','19M'],['AOV','2.11K'],['MoM Growth %','0.03'],['YoY Growth %','0.38']])+
   `<div class="grid g2s"><div class="stk2">${panel('Revenue by Month','st1',210)}${panel('Orders by Year','st2',210)}</div>${panel('Total Units Sold by Month','st3',450)}</div>`;
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],rv=[1552.3,1559.8,1562.5,1566.7,1557.9,1554.1,1564.5],below=[0,5];
  const lineLbl={id:'lineLbl4',afterDatasetsDraw(c){const x=c.ctx;x.save();x.fillStyle='#fff';x.font='600 10px "Segoe UI"';x.textAlign='center';
    c.getDatasetMeta(0).data.forEach((p,i)=>{const b=below.includes(i);x.textBaseline=b?'top':'bottom';x.fillText(rv[i].toFixed(1)+'M',p.x,p.y+(b?8:-8));});x.restore();}};
  mk('st1',{type:'line',plugins:[lineLbl],data:{labels:days,datasets:[{data:rv,borderColor:'#1e88ff',backgroundColor:'rgba(30,136,255,.35)',fill:'origin',tension:.4,borderWidth:2,pointRadius:4,pointBackgroundColor:'#fff',pointBorderWidth:0}]},
    options:{maintainAspectRatio:false,layout:{padding:{top:22,right:26,left:20,bottom:10}},plugins:{legend:{display:false}},
    scales:{x:{grid:{display:false},border:{display:false},ticks:{font:{size:9}}},y:{display:false,min:1548,max:1570}}}});
  /* 2023 share (24.38%) is hidden behind a tooltip in the screenshot; derived as the remainder */
  mk('st2',{type:'pie',plugins:[valueLabels],data:{labels:['2025','2024','2023','2022'],
    datasets:[{data:[26.95,25.72,24.38,22.95],backgroundColor:['#1e88ff','#12259a','#e8703a','#6a0f7a'],borderWidth:0}]},
    options:{maintainAspectRatio:false,layout:{padding:{left:60,right:30,top:22,bottom:22}},
    plugins:{legend:{position:'right',labels:{usePointStyle:true,pointStyle:'circle',boxWidth:8,color:'#fff'}},
    valueLabels:{labels:['1M (26.95%)','1M (25.72%)','1M (24.38%)','1M (22.95%)']}}}});
  const uv=[1.30,1.22,1.45,1.45,1.53,1.53,1.45,1.60,1.61,1.60,1.88,2.12];
  mk('st3',{type:'bar',plugins:[valueLabels],data:{labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
    datasets:[{data:uv,backgroundColor:['#3f4fb0','#a0d2ff','#3f4fb0','#6b7fd0','#3f4fb0','#6b7fd0','#3f4fb0','#3f4fb0','#6b7fd0','#3f4fb0','#6b7fd0','#3f4fb0'],barPercentage:.85,categoryPercentage:.95}]},
    options:{maintainAspectRatio:false,layout:{padding:{top:22}},plugins:{legend:{display:false},valueLabels:{labels:uv.map(v=>v.toFixed(2)+'M')}},
    scales:{x:{grid:{display:false},border:{display:false},ticks:{font:{size:9}}},y:{display:false,min:0,max:2.3}}}});
}

/* ---------- Page 5: Region/City Sales ---------- */
function buildRegionCity(root){
  const rows=[['Islamabad Express Store','84032','17,83,70,967.78'],['Hyderabad Convenience Store','122369','25,72,20,395.48'],['Sukkur Convenience Store','122254','25,82,77,441.00'],['Islamabad Convenience Store','122191','25,83,86,932.36'],['Rawalpindi Convenience Store','122732','25,84,87,210.91'],['Gujranwala Convenience Store','123118','25,87,38,936.06'],['Sialkot Convenience Store','122491','25,95,28,634.34']];
  const cols=['StoreName','Total Orders','Total Revenue'];
  const num=s=>parseFloat(String(s).replace(/,/g,''));
  let sc=2,dir=1;
  root.innerHTML=`<style>.rs{width:100%;border-collapse:collapse;font-size:11px;font-weight:700}
   .rs th{position:sticky;top:0;background:#2a2f3d;color:#fff;padding:8px 6px;cursor:pointer;user-select:none;white-space:nowrap}
   .rs td{padding:5px 6px;white-space:nowrap}.rs td+td,.rs th+th{text-align:right}
   .rs tbody tr:nth-child(odd){background:#3f4fb0;color:#fff}.rs tbody tr:nth-child(even){background:#6db8ff;color:#0a1630}
   .g2r{grid-template-columns:1fr 1.5fr}@media(max-width:900px){.g2r{grid-template-columns:1fr}}</style>`+
   kpiRow([['Total Revenue','10.92bn'],['Total Orders','5M'],['Total Units Sold','19M'],['Gross Profit','3.01bn'],['Profit Margin %','27.57%']]).replace('class="kpis"','class="kpis" style="grid-template-columns:repeat(5,1fr)"')+
   `<div class="grid g2r"><div class="panel"><h3>Revenue By Store</h3><div style="max-height:200px;overflow:auto"><table class="rs"><thead><tr id="rsh"></tr></thead><tbody id="rsb"></tbody></table></div></div>${panel('Total Revenue by Store Type','rc1',200)}</div>`+
   panel('Revenue by City','rc2',260);
  function draw(){
    const r=rows.slice().sort((a,b)=>sc===0?dir*a[0].localeCompare(b[0]):dir*(num(a[sc])-num(b[sc])));
    root.querySelector('#rsh').innerHTML=cols.map((c,i)=>`<th data-c="${i}">${c}${i===sc?(dir<0?' \u25BC':' \u25B2'):''}</th>`).join('');
    root.querySelector('#rsb').innerHTML=r.map(x=>`<tr>${x.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('');
  }
  root.querySelector('#rsh').addEventListener('click',e=>{const t=e.target.closest('th');if(!t)return;const c=+t.dataset.c;dir=(c===sc)?-dir:(c===0?1:-1);sc=c;draw();});
  draw();
  mk('rc1',{type:'bar',plugins:[valueLabels],data:{labels:['Supermarket','Hypermarket','Convenience Store','Express Store'],
    datasets:[{data:[4.3,3.6,2.8,0.2],backgroundColor:'#1e88ff',barPercentage:.4,categoryPercentage:1}]},
    options:{maintainAspectRatio:false,layout:{padding:{top:20}},plugins:{legend:{display:false},valueLabels:{labels:['4.3bn','3.6bn','2.8bn','0.2bn']}},
    scales:{x:{grid:{display:false},border:{display:false},ticks:{font:{size:9}}},y:{display:false,min:0,max:4.6}}}});
  const cities=['Karachi','Lahore','Islamabad','Rawalpindi','Faisalabad','Peshawar','Multan','Gujranwala','Sialkot','Quetta','Hyderabad','Sukkur','Bahawalpur','Abbottabad','Sargodha'];
  const cv=[3.7,3.2,2.4,2.0,1.9,1.5,1.3,1.2,1.1,1.0,0.9,0.8,0.8,0.8,0.7];
  const lerp=(t)=>{const a=[160,210,255],b=[63,79,176];return 'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')'};
  mk('rc2',{type:'bar',plugins:[valueLabels],data:{labels:cities,datasets:[{data:cv,backgroundColor:cv.map(v=>lerp((v-0.7)/3.0)),barPercentage:.7,categoryPercentage:1}]},
    options:{maintainAspectRatio:false,layout:{padding:{top:20}},plugins:{legend:{display:false},valueLabels:{labels:cv.map(v=>v.toFixed(1)+'M')}},
    scales:{x:{grid:{display:false},border:{display:false},ticks:{font:{size:9}}},y:{display:false,min:0,max:4}}}});
}

/* ---------- Page 8: Profit & Revenue ---------- */
function buildProfitRevenue(root){
  root.innerHTML=
   kpiRow([['Total Revenue','10.92bn'],['Total Units Sold','19M'],['Total Orders','5M'],['Profit Margin %','27.57%'],['Gross Profit','3.01bn']]).replace('class="kpis"','class="kpis" style="grid-template-columns:repeat(5,1fr)"')+
   `<div class="grid">${panel('Order by Customer','pr1',230)}${panel('Profit by Category','pr2',230)}${panel('Top 10 Brand by Profit','pr3',230)}${panel('Profit Margin by Category','pr4',230)}</div>`;
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  /* series values estimated from bar heights in the screenshot */
  mk('pr1',{type:'bar',data:{labels:months,datasets:[
    {data:[.60,.60,.76,.70,.65,.73,.71,.70,.73,.85,1.00,.96],backgroundColor:'#1e88ff'},
    {data:[.86,.80,.99,.93,.93,.95,.98,.92,1.03,1.20,1.46,1.38],backgroundColor:'#12259a'}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{x:{grid:{display:false},border:{display:false},ticks:{font:{size:9}}},y:{min:0,max:2,grid:{display:false},border:{display:false},ticks:{stepSize:.5,callback:v=>v.toFixed(1)+'M',font:{size:9}}}}}});
  const cats=['Electronics & Accessories','Apparel & Footwear','Home & Kitchen','Personal Care','Health & Wellness','Frozen Foods','Home Care','Grocery','Dairy & Bakery','Stationery & Office','Beverages','Snacks & Confectionery'];
  const fv=[1.53,1.32,1.06,1.02,.59,.48,.27,.22,.21,.20,.11,.08];
  const funLbl={id:'funLbl',afterDatasetsDraw(c){const x=c.ctx;x.save();x.font='600 9px "Segoe UI"';x.textBaseline='middle';x.fillStyle='#fff';
    c.getDatasetMeta(0).data.forEach((el,i)=>{const l=Math.min(el.x,el.base),r=Math.max(el.x,el.base),t=fv[i].toFixed(2)+'M';
      if(fv[i]<.15){x.textAlign='left';x.fillText(t,r+4,el.y);}else{x.textAlign='center';x.fillText(t,(l+r)/2,el.y);}});x.restore();}};
  mk('pr2',{type:'bar',plugins:[funLbl],data:{labels:cats,datasets:[{data:fv.map(v=>[-v/2,v/2]),backgroundColor:'#1e88ff',barPercentage:.95,categoryPercentage:1}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fv[c.dataIndex].toFixed(2)+'M'}}},
    scales:{x:{display:false,min:-.8,max:.8},y:{grid:{display:false},border:{display:false},ticks:{font:{size:8}}}}}});
  mk('pr3',{type:'bar',plugins:[valueLabels],data:{labels:['QuickBite','SoftTouch','ValueChoice','UrbanBite','TrueTaste','PurePlus','ZestyCo','SmartBuy','SunriseFoods','SparkleClean'],
    datasets:[{data:[147,106,100,96,93,89,79,76,66,65],backgroundColor:'#1e88ff',barPercentage:.8,categoryPercentage:.95}]},
    options:{indexAxis:'y',maintainAspectRatio:false,layout:{padding:{right:36}},
    plugins:{legend:{display:false},valueLabels:{labels:['147M','106M','100M','96M','93M','89M','79M','76M','66M','65M']}},
    scales:{x:{display:false,min:0},y:{grid:{display:false},border:{display:false},ticks:{font:{size:8}}}}}});
  /* last 3 legend names are not visible in the screenshot (legend is scrolled) - assumed */
  mk('pr4',{type:'pie',plugins:[valueLabels],data:{labels:['Stationery & Office','Frozen Foods','Grocery','Home Care','Home & Kitchen','Snacks & Confectionery','Health & Wellness','Personal Care','Apparel & Footwear','Beverages','Dairy & Bakery','Electronics & Accessories'],
    datasets:[{data:[8.65,8.55,8.53,8.44,8.36,8.36,8.32,8.24,8.18,8.16,8.1,8.09],
    backgroundColor:['#1e88ff','#12259a','#e8703a','#6a0f7a','#e040a8','#7a5cc7','#d9b200','#d94a5a','#1e7a7a','#2fa84f','#12c0e8','#4a8cff'],borderWidth:0}]},
    options:{maintainAspectRatio:false,layout:{padding:{left:34,right:20,top:22,bottom:22}},
    plugins:{legend:{position:'right',labels:{usePointStyle:true,pointStyle:'circle',boxWidth:7,padding:6,font:{size:9},color:'#fff'}},
    valueLabels:{labels:['8.65%','8.55%','8.53%','8.44%','8.36%','8.36%','8.32%','8.24%','8.18%','8.16%','8.1%','8.09%']}}}});
}

/* ---------- Page 3: Product Performances ---------- */
function buildProductPerformances(root){
  const rows=[['BasicNeeds Bath & Body 250ml','16,43,868.48','21,27,622.73','4,83,754.25','22.74%'],['BasicNeeds Bath & Body 2L','2,74,615.93','3,78,065.42','1,03,449.49','27.36%'],['BasicNeeds Bath & Body 500g','3,29,566.38','4,55,628.88','1,26,062.50','27.67%'],['BasicNeeds Bath & Body Pack of 12','65,19,023.82','81,69,932.35','16,50,908.53','20.21%'],['BasicNeeds Batteries Family Pack','51,09,168.02','61,93,532.05','10,84,364.03','17.51%'],['BasicNeeds Batteries Large','3,88,531.08','4,86,170.63','97,639.55','20.08%'],['BasicNeeds Batteries Medium','73,21,296.00','1,03,02,639.86','29,81,343.86','28.94%'],['BasicNeeds Biscuits & Cookies Small','3,02,640.80','4,71,804.01','1,69,163.21','35.85%'],['BasicNeeds Bottled Water Small','11,75,217.35','16,55,512.13','4,80,294.78','29.01%'],['BasicNeeds Bread 1kg','8,12,476.19','13,54,944.02','5,42,467.83','40.04%'],['BasicNeeds Bread 250ml','3,30,791.76','5,14,328.12','1,83,536.36','35.68%'],['BasicNeeds Bread Family Pack','1,93,816.26','2,46,241.79','52,425.53','21.29%'],['BasicNeeds Bread Small','16,73,068.32','21,64,517.08','4,91,448.76','22.70%'],['BasicNeeds Butter & Ghee 2kg','1,71,998.43','2,11,148.66','39,150.23','18.54%'],['BasicNeeds Butter & Ghee 2L','15,66,008.40','24,32,909.08','8,66,900.68','35.63%'],['BasicNeeds Butter & Ghee Family Pack','2,07,922.78','2,44,574.97','36,652.19','14.99%'],['BasicNeeds Butter & Ghee Large','2,78,063.18','4,32,018.21','1,53,955.03','35.64%'],['BasicNeeds Candy 100g','82,025.85','1,23,367.06','41,341.21','33.51%'],['BasicNeeds Candy 1L','1,10,165.65','1,53,700.87','43,535.22','28.32%']];
  const orig=rows.slice(),cols=['Product','Total cost','Total Revenue','Gross Profit','Profit Margin %'];
  const num=s=>parseFloat(String(s).replace(/[,%]/g,''));
  let sc=-1,dir=-1;

/* ---------- Switch function ---------- */
function showDashboard(i){
  document.querySelectorAll('.page').forEach((el,k)=>el.classList.toggle('active',k===i));
  document.querySelectorAll('.tab').forEach((el,k)=>el.classList.toggle('active',k===i));
  pageTitle.textContent=PAGES[i].name;
  const root=document.getElementById('page-'+i);
  if(!built[i]){
    if(PAGES[i].build)PAGES[i].build(root);
    else root.innerHTML=`<div class="ph">${PAGES[i].name} — awaiting screenshot</div>`;
    built[i]=true;
  }
}
